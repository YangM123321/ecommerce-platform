# config-server: build, test, analyse, push, deploy - only when its own files change.
# Created in Azure DevOps as pipeline "config-server" from this file (docs/ci-cd.md).
trigger:
  branches:
    include: [main]
  paths:
    include:
      - config-server
      - pom.xml
      - Dockerfile
      - charts/service
      - deploy/values/config-server.yaml

pr: none   # pull requests are checked by GitHub Actions (.github/workflows/ci.yml)

variables:
  - group: ecommerce-azure

stages:
  - template: templates/service-stages.yml
    parameters:
      service: config-server
      hasTests: false
