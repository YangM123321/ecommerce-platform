# product-service: build, test, analyse, push, deploy - only when its own files change.
# Created in Azure DevOps as pipeline "product-service" from this file (docs/ci-cd.md).
trigger:
  branches:
    include: [main]
  paths:
    include:
      - product-service
      - common
      - pom.xml
      - Dockerfile
      - charts/service
      - deploy/values/product-service.yaml

pr: none   # pull requests are checked by GitHub Actions (.github/workflows/ci.yml)

variables:
  - group: ecommerce-azure

stages:
  - template: templates/service-stages.yml
    parameters:
      service: product-service
      hasTests: true
