name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Builds every module and runs every module's tests (unit, web-layer, Testcontainers).
      # Docker is preinstalled on GitHub's ubuntu runners, so Testcontainers works.
      - name: Build and test all modules
        run: mvn -B verify

      # One image per service, all from the same Dockerfile (MODULE build argument).
      - name: Check every Docker image builds
        run: docker compose build
