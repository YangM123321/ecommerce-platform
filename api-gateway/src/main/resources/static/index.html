<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecommerce-platform</title>
<style>
  :root { --ink:#1d2433; --muted:#5f6b7a; --line:#e3e7ee; --bg:#f6f7f9; --accent:#2f6fde; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:18px 24px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card .img { aspect-ratio:4/3; background:#eef1f5; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .body { padding:12px 14px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .meta { color:var(--muted); font-size:13px; display:flex; justify-content:space-between; }
  .price { font-weight:600; color:var(--ink); }
  section.admin { margin-top:32px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  section.admin h2 { margin:0 0 10px; font-size:16px; }
  form { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  input, select, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  #status { color:var(--muted); font-size:13px; min-height:1.5em; }
</style>
</head>
<body>
<header>
  <h1>ecommerce-platform</h1>
  <p>Served by api-gateway. Products come from product-service; images load straight from Blob Storage.</p>
</header>
<main>
  <div id="products" class="grid"></div>

  <section class="admin">
    <h2>Admin: upload a product image</h2>
    <form id="login">
      <input id="email" type="email" placeholder="admin email" required>
      <input id="password" type="password" placeholder="password" required>
      <button type="submit">Log in</button>
    </form>
    <form id="upload" hidden>
      <select id="product"></select>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" required>
      <button type="submit">Upload</button>
    </form>
    <div id="status"></div>
  </section>
</main>
<script>
  let token = null;
  const statusEl = document.getElementById('status');
  const say = (text) => { statusEl.textContent = text; };

  // Text is set with textContent (never innerHTML), so a product name can't inject HTML.
  function card(p) {
    const el = document.createElement('div');
    el.className = 'card';
    const img = document.createElement('div');
    img.className = 'img';
    if (p.imageUrl) {
      const i = document.createElement('img');
      i.src = p.imageUrl;
      i.alt = p.name;
      img.appendChild(i);
    } else {
      img.textContent = 'No image yet';
    }
    const body = document.createElement('div');
    body.className = 'body';
    const h = document.createElement('h3');
    h.textContent = p.name;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const price = document.createElement('span');
    price.className = 'price';
    price.textContent = '$' + Number(p.price).toFixed(2);
    const stock = document.createElement('span');
    stock.textContent = p.available + ' in stock';
    meta.append(price, stock);
    body.append(h, meta);
    el.append(img, body);
    return el;
  }

  async function loadProducts() {
    const grid = document.getElementById('products');
    const res = await fetch('/api/products?size=50&sort=id');
    if (!res.ok) { grid.textContent = 'Could not load products (HTTP ' + res.status + ')'; return; }
    const page = await res.json();
    grid.replaceChildren(...page.content.map(card));
    const select = document.getElementById('product');
    select.replaceChildren(...page.content.map(p => {
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.id + ' - ' + p.name;
      return o;
    }));
  }

  document.getElementById('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    if (!res.ok) { say('Login failed (HTTP ' + res.status + ')'); return; }
    token = (await res.json()).accessToken;   // kept in memory only, gone on refresh
    document.getElementById('login').hidden = true;
    document.getElementById('upload').hidden = false;
    say('Logged in. Pick a product and an image (JPEG, PNG or WebP, max 2 MB).');
  });

  document.getElementById('upload').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = new FormData();
    form.append('file', document.getElementById('file').files[0]);
    const id = document.getElementById('product').value;
    const res = await fetch('/api/products/' + id + '/image', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: form
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).detail || ''; } catch (ignored) {}
      say('Upload failed (HTTP ' + res.status + ') ' + detail);
      return;
    }
    say('Uploaded. The image now loads from: ' + (await res.json()).imageUrl);
    loadProducts();
  });

  loadProducts();
</script>
</body>
</html>
