# Values come from Terraform outputs at install time; nothing secret is in Git.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ required (printf "secrets.%s is required" $key) $value | quote }}
  {{- end }}
