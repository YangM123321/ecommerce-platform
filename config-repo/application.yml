# Shared by ALL services, in every environment.

app:
  jwt:
    # Placeholder: the real value comes from the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: ecommerce-platform
    access-token-ttl: 15m
    refresh-token-ttl: 7d

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Look up other services every 5 s (default 30 s), so stopped services drop out fast.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness, used by Kubernetes in Session 5
