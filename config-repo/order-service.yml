# order-service, every environment. db.* comes from application-<profile>.yml.

spring:
  datasource:
    url: jdbc:postgresql://${db.host}:${db.port}/orders_db${db.params}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}

  cloud:
    openfeign:
      client:
        config:
          product-service:
            # Fail fast instead of hanging when product-service is slow or down.
            connect-timeout: 2000
            read-timeout: 3000
