# product-service, every environment. db.* comes from application-<profile>.yml.

spring:
  datasource:
    url: jdbc:postgresql://${db.host}:${db.port}/catalog_db${db.params}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}

  data:
    web:
      pageable:
        max-page-size: 100
