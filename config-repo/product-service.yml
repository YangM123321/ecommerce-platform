# product-service, every environment. db.* comes from application-<profile>.yml.

spring:
  datasource:
    url: jdbc:postgresql://${db.host}:${db.port}/catalog_db${db.params}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}

  data:
    web:
      pageable:
        max-page-size: 100

app:
  # Product images (Session 5). Locally: Azurite in Docker Compose. On Azure: a Storage account.
  # The connection string contains the account key, so it only ever comes from an env variable
  # (a Kubernetes Secret on AKS). No connection string = uploads answer 503, everything else works.
  storage:
    connection-string: ${STORAGE_CONNECTION_STRING:}
    container: ${STORAGE_CONTAINER:product-images}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
