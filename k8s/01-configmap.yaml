# Non-secret settings shared by the business services and the gateway.
# __DB_HOST__ is filled in by scripts/azure/deploy.ps1.
# Secrets (passwords, JWT key, storage key) are in the "ecommerce-secrets" Secret,
# which deploy.ps1 creates from values that are never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  SPRING_PROFILES_ACTIVE: azure                      # loads config-repo/application-azure.yml
  CONFIG_SERVER_URL: http://config-server:8888       # Kubernetes DNS: <service name>:<port>
  EUREKA_URL: http://discovery-server:8761/eureka
  DB_HOST: __DB_HOST__
  # The JVM sizes its heap from the container's memory limit (60%; the rest is for metaspace, threads and native memory), not the node's memory.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC"
