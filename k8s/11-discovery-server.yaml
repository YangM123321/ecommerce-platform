# Eureka. (Kubernetes has its own service discovery too - we keep Eureka so the same code
# runs locally and on AKS. Interview point: on Kubernetes you could drop Eureka entirely.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: ecommerce
  labels: { app: discovery-server }
spec:
  replicas: 1
  # One small node: stop the old pod first, then start the new one. Running old and new side
  # by side (the default) needs room for both, and there isn't any. Cost: a few seconds of
  # downtime per service on each deploy. With 2+ nodes/replicas: maxSurge 1, maxUnavailable 0.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: discovery-server }
  template:
    metadata:
      labels: { app: discovery-server }
    spec:
      containers:
        - name: discovery-server
          image: __ACR__/discovery-server:__TAG__
          ports:
            - containerPort: 8761
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC"
          resources:
            requests: { cpu: 25m, memory: 320Mi }
            limits: { memory: 448Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8761 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8761 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8761 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: ecommerce
spec:
  selector: { app: discovery-server }
  ports:
    - port: 8761
      targetPort: 8761
