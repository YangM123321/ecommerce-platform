# user-service: register, login, tokens, users
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
  labels: { app: user-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      terminationGracePeriodSeconds: 30   # time for graceful shutdown + Eureka deregistration
      containers:
        - name: user-service
          image: __ACR__/user-service:__TAG__
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: ecommerce-config }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: JWT_SECRET } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: ADMIN_PASSWORD } }
          resources:
            requests: { cpu: 25m, memory: 448Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce
spec:
  selector: { app: user-service }
  ports:
    - port: 8081
      targetPort: 8081
