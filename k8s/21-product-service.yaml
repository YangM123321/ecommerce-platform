# product-service: catalog, stock, product images in Blob Storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
  labels: { app: product-service }
spec:
  replicas: 1
  # One small node: stop the old pod first, then start the new one. Running old and new side
  # by side (the default) needs room for both, and there isn't any. Cost: a few seconds of
  # downtime per service on each deploy. With 2+ nodes/replicas: maxSurge 1, maxUnavailable 0.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      terminationGracePeriodSeconds: 30   # time for graceful shutdown + Eureka deregistration
      containers:
        - name: product-service
          image: __ACR__/product-service:__TAG__
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: ecommerce-config }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: JWT_SECRET } }
            - name: STORAGE_CONNECTION_STRING
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: STORAGE_CONNECTION_STRING } }
          resources:
            requests: { cpu: 25m, memory: 448Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
spec:
  selector: { app: product-service }
  ports:
    - port: 8082
      targetPort: 8082
