# api-gateway: the only service the Ingress sends traffic to
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
  labels: { app: api-gateway }
spec:
  replicas: 1
  # One small node: stop the old pod first, then start the new one. Running old and new side
  # by side (the default) needs room for both, and there isn't any. Cost: a few seconds of
  # downtime per service on each deploy. With 2+ nodes/replicas: maxSurge 1, maxUnavailable 0.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      terminationGracePeriodSeconds: 30   # time for graceful shutdown + Eureka deregistration
      containers:
        - name: api-gateway
          image: __ACR__/api-gateway:__TAG__
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: ecommerce-config }
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: 25m, memory: 384Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
