# The public entry point. AKS's application routing add-on (managed NGINX) gets a public IP
# and sends ALL traffic to the gateway. Only the gateway is reachable from the internet;
# every other Service is ClusterIP (inside the cluster only).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: ecommerce
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "3m"   # allow 2 MB image uploads
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
