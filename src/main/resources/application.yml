spring:
  application:
    name: ecommerce-platform

  # Values come from environment variables, with local defaults.
  # Docker Compose sets DB_URL to point at the "postgres" container.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness and /readiness, used by Kubernetes in Session 5

app:
  jwt:
    # Dev-only default so the app starts locally. Real deployments MUST set JWT_SECRET
    # (at least 32 characters). Never commit a real secret.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: ecommerce-platform
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  # First admin account, created at startup if both values are set (see AdminBootstrap).
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
